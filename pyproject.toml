[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-stable"
version = "1.1.4"
description = "Record, detect, and apply engineering guardrails for degenerate loops in LLM output and tool calls"
readme = "README.en.md"
requires-python = ">=3.10"
keywords = ["llm", "guardrails", "loop-detection", "observability", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

license = {file = "LICENSE"}
authors = [{name = "xli498"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/xli498/mimo-stable"
Repository = "https://github.com/xli498/mimo-stable"
Changelog = "https://github.com/xli498/mimo-stable/blob/main/CHANGELOG.md"
Issues = "https://github.com/xli498/mimo-stable/issues"

[project.scripts]
mimo-loop-detect = "mimo_stable.detect_loop:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["mimo_stable*"]
