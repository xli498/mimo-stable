[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-stable"
version = "1.1.1"
description = "Record, detect, and apply engineering guardrails for degenerate loops in LLM output and tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "xli498"}]
dependencies = []

[project.scripts]
mimo-loop-detect = "scripts.detect_loop:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["scripts*"]
