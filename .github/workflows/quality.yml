name: Quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install check dependencies
        if: matrix.python-version == '3.10'
        run: python -m pip install tomli
      - name: Run checks
        shell: bash
        run: |
          python -m py_compile scripts/*.py
          python -m py_compile mimo_stable/*.py
          python scripts/check_version.py
          bash -n scripts/*.sh
          python -m pip install ".[test]"
          python -m pytest -q
          python3 scripts/benchmark_fixtures.py
      - name: Verify installed CLI
        shell: bash
        run: |
          python - <<'PY'
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          import mimo_stable
          with open("pyproject.toml", "rb") as handle:
              expected = tomllib.load(handle)["project"]["version"]
          assert mimo_stable.__version__ == expected
          PY
          set +e
          mimo-loop-detect --json --timeout 60 --log fixtures/loop_detected.log > result.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          with open("result.json", encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["loop_detected"] is True
          assert result["details"]["type"] == "consecutive_identical_output"
          PY
