name: Quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run checks
        shell: bash
        run: |
          python -m py_compile scripts/*.py
          python scripts/check_version.py
          bash -n scripts/*.sh
          python3 tests/test_detector.py
          python3 scripts/benchmark_fixtures.py
      - name: Verify installed CLI
        shell: bash
        run: |
          python -m pip install --no-deps .
          set +e
          mimo-loop-detect --json --timeout 60 --log fixtures/loop_detected.log > result.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          with open("result.json", encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["loop_detected"] is True
          assert result["details"]["type"] == "consecutive_identical_output"
          PY
