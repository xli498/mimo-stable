<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LLM Degenerate Loop Guardrails architecture</title>
  <desc id="desc">A pipeline from model output and tool calls through detection and recovery decision layers to an upper-layer runner. Detection and recovery layers emit signals only and execute no side effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#0f172a">Detect the signal. Stop the waste.</text>
  <text x="600" y="74" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#475569">检测与决策层只输出信号，不执行重试、切模或工具调用</text>
  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="45" y="145" width="190" height="110" rx="16" fill="#fff" stroke="#94a3b8"/>
    <text x="140" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">模型运行器</text>
    <text x="140" y="208" text-anchor="middle" font-size="14" fill="#475569">输出流</text>
    <text x="140" y="231" text-anchor="middle" font-size="14" fill="#475569">工具调用</text>
    <rect x="290" y="145" width="190" height="110" rx="16" fill="#fff" stroke="#818cf8" stroke-width="2"/>
    <text x="385" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">输入解析</text>
    <text x="385" y="208" text-anchor="middle" font-size="14" fill="#475569">脱敏事件块</text>
    <text x="385" y="231" text-anchor="middle" font-size="14" fill="#475569">时间与边界校验</text>
    <rect x="535" y="145" width="190" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="630" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">detect_loop.py</text>
    <text x="630" y="208" text-anchor="middle" font-size="14" fill="#4338ca">检测循环信号</text>
    <text x="630" y="231" text-anchor="middle" font-size="14" fill="#475569">文本 · 工具 · 语言漂移</text>
    <rect x="780" y="145" width="190" height="110" rx="16" fill="#fff" stroke="#818cf8" stroke-width="2"/>
    <text x="875" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#312e81">recovery_policy.py</text>
    <text x="875" y="208" text-anchor="middle" font-size="14" fill="#475569">保守决策摘要</text>
    <text x="875" y="231" text-anchor="middle" font-size="14" fill="#475569">只输出 action</text>
    <rect x="1025" y="145" width="130" height="110" rx="16" fill="#fff" stroke="#94a3b8"/>
    <text x="1090" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">上层</text>
    <text x="1090" y="208" text-anchor="middle" font-size="14" fill="#475569">暂停</text>
    <text x="1090" y="231" text-anchor="middle" font-size="14" fill="#475569">复核 / 恢复</text>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M235 200 H282"/><path d="M480 200 H527"/><path d="M725 200 H772"/><path d="M970 200 H1017"/></g>
  <rect x="270" y="315" width="660" height="55" rx="27" fill="#fff7ed" stroke="#fb923c"/>
  <text x="600" y="349" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#9a3412">检测器与恢复层均无隐式副作用：不重试 · 不切换模型 · 不调用工具</text>
</svg>
